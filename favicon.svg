<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark sci-fi rounded background -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="28" fill="url(#cyberGlow)" />

  <!-- Futuristic Cyber Glyph -->
  <g transform="translate(8, 8) scale(2)" filter="url(#glowEffect)">
    <!-- Top diamond layer -->
    <polygon points="12 3 3 8 12 13 21 8" fill="rgba(0, 240, 255, 0.2)" stroke="url(#cyberGrad)" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Middle chevron layer -->
    <polyline points="3 13 12 18 21 13" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <!-- Bottom chevron layer -->
    <polyline points="3 18 12 23 21 18" fill="none" stroke="#9d4edd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>
</svg>
